<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- GameMaster AI app icon: a gold d20-style die on the app's dark background.
       Simple geometric shapes only, so it stays legible at 16x16. -->
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>
  <!-- Die body (hexagon, d20 silhouette) -->
  <polygon points="32,8 52,20 52,44 32,56 12,44 12,20" fill="none" stroke="#d4af37" stroke-width="3" stroke-linejoin="round"/>
  <!-- Inner facet lines -->
  <polygon points="32,20 44,27 44,37 32,44 20,37 20,27" fill="none" stroke="#d4af37" stroke-width="2" stroke-linejoin="round"/>
  <line x1="32" y1="8" x2="32" y2="20" stroke="#d4af37" stroke-width="2"/>
  <line x1="12" y1="20" x2="20" y2="27" stroke="#d4af37" stroke-width="2"/>
  <line x1="52" y1="20" x2="44" y2="27" stroke="#d4af37" stroke-width="2"/>
  <line x1="12" y1="44" x2="20" y2="37" stroke="#d4af37" stroke-width="2"/>
  <line x1="52" y1="44" x2="44" y2="37" stroke="#d4af37" stroke-width="2"/>
  <line x1="32" y1="56" x2="32" y2="44" stroke="#d4af37" stroke-width="2"/>
  <!-- Centre pip -->
  <circle cx="32" cy="32" r="3.5" fill="#d4af37"/>
</svg>
