name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyCI5yyCGQiHAxeqFE3kVW55IPiWvz7LVPk"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "gamemaster-ai-69b41.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "gamemaster-ai-69b41"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:348924371995:web:21f85bbc17679f8f0084be"
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: "6LeV4x0uAAAAALC-C3Aa7p_nh2ThiqugmndKnTQD"
      NEXT_PUBLIC_BASE_PATH: "/gamemaster-ai"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static export
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
